<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олий Математика Тест Тизими</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: white; padding: 15px; display: flex; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        #quiz-outer-container {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center;
        }

        /* Таймер ва Тил танлаш (расмдаги каби) */
        .top-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #timer { font-size: 24px; font-weight: bold; color: #333; }
        .lang-badge { border: 2px solid #000; border-radius: 20px; padding: 5px 20px; font-weight: bold; }

        #start-screen { padding: 40px 20px; }
        .start-btn { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.2rem; cursor: pointer; }

        #quiz-content { display: none; }
        
        .options { display: grid; gap: 8px; margin-top: 20px; }
        .option-btn { 
            background: #f8f9fa; color: #333; border: 1px solid #ddd; padding: 14px; 
            border-radius: 4px; cursor: pointer; font-size: 1rem; text-align: left; transition: 0.2s;
        }
        
        /* Тўғри ва хато ранглари */
        .option-btn.correct-ans { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60; }
        .option-btn.wrong-ans { background-color: #e74c3c !important; color: white !important; border-color: #c0392b; }
        .option-btn.selected { border: 2px solid var(--accent); background: #ebf5fb; }

        /* Пастки навигация */
        .nav-footer { background: #333; display: flex; align-items: center; justify-content: center; padding: 10px; margin-top: 20px; border-radius: 4px; overflow-x: auto; }
        .num-box {
            min-width: 30px; height: 35px; display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; font-weight: bold; border-right: 1px solid #555; padding: 0 10px;
        }
        .num-box:last-child { border-right: none; }
        .num-box.active { background: #3498db; }
        .num-box.nav-correct { color: #2ecc71; } /* Тўғри бўлса рақам яшил */
        .num-box.nav-wrong { color: #e74c3c; }   /* Хато бўлса рақам қизил */

        .bottom-panel { margin-top: 15px; }
        #submit-btn { width: 100%; padding: 15px; background: #444; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        #submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        footer { background: var(--primary); color: white; padding: 15px; text-align: center; }
    </style>
</head>
<body>

<header><strong>МАТЕМАТИКА</strong></header>

<main>
    <div id="quiz-outer-container">
        <div id="start-screen">
            <h2>Тестни бошлашга тайёрмисиз?</h2>
            <button class="start-btn" onclick="startQuiz()">Начать тестирование</button>
        </div>

        <div id="quiz-content">
            <div class="top-info">
                <div id="timer">20:00</div>
                <div class="lang-badge">Ўзбек</div>
            </div>
            
            <h2 id="question-text" style="text-align:left; font-size: 1.1rem;">Юкланмоқда...</h2>
            
            <div id="options-container" class="options"></div>
            
            <div class="bottom-panel">
                <button id="submit-btn" onclick="checkAnswer()" disabled>Ответить</button>
            </div>

            <div id="pagination" class="nav-footer"></div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
