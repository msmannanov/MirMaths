<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жогорку Математика Тест Системасы</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* ЖОГОРКУ ПАНЕЛЬ (МЕНЮ) */
        header { background: white; padding: 15px; display: flex; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header nav a { text-decoration: none; color: var(--primary); margin: 0 20px; font-weight: 600; text-transform: uppercase; cursor: pointer; }

        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        #quiz-outer-container {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center;
        }

        .top-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        #timer { font-size: 24px; font-weight: bold; color: var(--primary); }

        #image-container { display: none; margin-bottom: 15px; }
        #question-image { max-width: 100%; border-radius: 8px; }

        .options { display: grid; gap: 10px; margin-top: 20px; }
        .option-btn { background: #f8f9fa; border: 1px solid #ddd; padding: 14px; border-radius: 6px; cursor: pointer; text-align: left; transition: 0.2s; }
        .option-btn:hover { background: #e9ecef; }
        .option-btn.selected { border: 2px solid var(--accent); background: #ebf5fb; }
        .option-btn.correct-ans { background: #2ecc71 !important; color: white; }
        .option-btn.wrong-ans { background: #e74c3c !important; color: white; }
        
        /* Варианттардын ичиндеги сүрөттөр үчүн */
        .option-btn img { display: block; margin: 5px auto; max-height: 80px; border-radius: 4px; }

        .number-pagination { display: flex; justify-content: center; background: #333; margin-top: 25px; border-radius: 4px; overflow: hidden; }
        .num-box { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 0.85rem; font-weight: bold; border-right: 1px solid #555; }
        .num-box.active { background: var(--accent); }
        .num-box.nav-correct { background: #2ecc71 !important; }
        .num-box.nav-wrong { background: #e74c3c !important; }

        .bottom-panel { margin-top: 20px; }
        #submit-btn { width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        #submit-btn:disabled { opacity: 0.5; }

        footer { background: #fff; color: #333; padding: 15px; text-align: center; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<header>
    <nav>
        <a onclick="location.reload()">БАШКЫ БЕТ</a>
        <a onclick="showTopics()">ТЕСТТЕР</a>
        <a onclick="alert('Бул бөлүм иштелип жатат...')">ЖЫЙЫНТЫКТАР</a>
    </nav>
</header>

<main>
    <div id="quiz-outer-container">
        
        <div id="start-screen">
            <h2 style="font-size: 2rem; color: #2c3e50; margin-bottom: 10px;">Жогорку математика тести</h2>
            <p style="color: #7f8c8d; margin-bottom: 30px;">Теманы тандап, билим деңгээлиңизди текшериңиз.</p>
            <button class="option-btn" style="background: var(--accent); color: white; border: none; padding: 15px 60px; border-radius: 30px; font-size: 1.3rem; display: inline-block; text-align: center;" onclick="showTopics()">Тесттерди көрүү</button>
        </div>

        <div id="topics-screen" style="display: none;">
            <h2 style="color: var(--primary); margin-bottom: 20px;">Тесттин темасын тандаңыз</h2>
            <div id="topics-container" style="display: grid; gap: 12px; max-height: 400px; overflow-y: auto; padding: 5px;">
                </div>
        </div>

        <div id="quiz-content" style="display: none;">
            <div class="top-info">
                <div id="timer">20:00</div>
                <div id="current-topic-title" style="font-weight: bold; color: #7f8c8d;">Математика</div>
            </div>
            <div id="image-container"><img id="question-image" src=""></div>
            <h2 id="question-text" style="text-align: left; font-size: 1.1rem;"></h2>
            <div id="options-container" class="options"></div>
            <div class="bottom-panel">
                <button id="submit-btn" onclick="checkAnswer()" disabled>Жооб берүү</button>
            </div>
            <div id="pagination" class="number-pagination"></div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 style="color: var(--primary);">Тест аяктады!</h2>
            <div style="font-size: 1.5rem; margin: 20px 0;">
                Туура жооптор: <span id="correct-count" style="color: #2ecc71; font-weight: bold;">0</span> / <span id="total-count">0</span>
            </div>
            <p id="percentage" style="font-size: 1.2rem; color: #7f8c8d;"></p>
            <button class="option-btn" style="background: var(--accent); color: white; border: none; padding: 12px 40px; border-radius: 30px; display: inline-block;" onclick="showTopics()">Темаларга кайтуу</button>
        </div>
        
    </div>
</main>

<footer><p>&copy; 2026 Жогорку Математика Тест Системасы</p></footer>

<script src="script.js"></script>
</body>
</html>
